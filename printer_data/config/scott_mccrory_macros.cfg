# Scott McCrory's Klipper Macros
# Created for the K1-MAX and PrusaSlicer
# 01/26/2026

# SCOTT_START_PRINT - Print startup macro
# Displays assumptions such as filament type, nozzle size, temps, chamber and bed setups
# Be sure to add the following to the printer profile's start g-code:
# START_PRINT BED_TEMP=[first_layer_bed_temperature] EXTRUDER_TEMP=[first_layer_temperature] FILAMENT=[filament_type] NOZZLE={nozzle_diameter[0]}
#
[gcode_macro SCOTT_START_PRINT]
gcode:
  {% set filament_raw = params.FILAMENT|default("unknown")|string %}
  {% set filament = filament_raw|lower|replace('"','')|replace("'","") %}
  {% set filament = filament.split('(')[0].strip() %}     # drop " (Inland)" etc.
  {% set filament = filament.replace(' ', '') %}          # "pla plus" -> "plaplus"
  {% set nozzle = params.NOZZLE|default("0.4")|string %}
  {% set bed = params.BED_TEMP|default("n/a") %}
  {% set hotend = params.EXTRUDER_TEMP|default("n/a") %}

  {% set pla_set = ["pla","plaplus","pla+","toughpla"] %}
  {% set cool_set = pla_set + ["petg","tpu"] %}
  {% set hot_set  = ["pctg","abs","asa","pc","pa"] %}

  {% if filament in cool_set %}
    {% set chamber_policy = "Open / Vented @35C" %}
    {% set build_plate = "SMOOTH PEI (A Plate)" %}
  {% elif filament in hot_set %}
    {% set chamber_policy = "Sealed @40C (watch heat creep)" %}
    {% set build_plate = "TEXTURED PEI (B Plate)" %}
  {% else %}
    {% set chamber_policy = "⚠️ Filament type UNKNOWN – double-check setup!" %}
    {% set build_plate = "⚠️ UNKNOWN – double-check plate!" %}
  {% endif %}

  {action_respond_info("----- START_PRINT CHECK -----")}
  {action_respond_info("Nozzle: " ~ nozzle ~ " mm")}
  {action_respond_info("Temps: Bed " ~ bed ~ "C, Nozzle " ~ hotend ~ "C")}
  {action_respond_info("Filament: " ~ filament_raw ~ "  ->  " ~ filament)}
  {action_respond_info("Bed plate: " ~ build_plate)}
  {action_respond_info("Chamber: " ~ chamber_policy)}
  {action_respond_info("-----------------------------")}