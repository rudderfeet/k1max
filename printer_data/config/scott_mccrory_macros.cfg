[gcode_macro SCOTT_START_PRINT]
gcode:
  # Grabs known values and sanitizes the strings
  {% set filament_raw = params.FILAMENT|default("unknown")|string %}
  {% set filament = filament_raw|lower|replace('"','')|replace("'","") %}
  {% set filament = filament.split('(')[0].strip() %}
  {% set filament = filament.replace(' ', '') %}
  {% set filament = filament.replace('-', '') %}
  {% set filament = filament.replace('_', '') %}
  {% set nozzle = params.NOZZLE|default("0.4")|string %}
  {% set bed = params.BED_TEMP|default("n/a") %}
  {% set hotend = params.EXTRUDER_TEMP|default("n/a") %}

  # Groups (extend as you like)
  {% set pla_set = ["pla","plaplus","pla+","toughpla"] %}
  {% set petg_set = ["petg","petg+"] %}
  {% set tpu_set  = ["tpu","tpu95","tpu98a","tpu90a","tpu87a","ninjaflex","flex"] %}
  {% set asa_abs_set = ["asa","asa+","abs","abs+"] %}
  {% set pctg_set = ["pctg"] %}
  {% set eng_set = ["pc","pa","nylon","pa-cf","pacf","pc-cf","pccf","petg-cf","petgcf"] %}

  # Defaults
  {% set chamber_policy = "⚠️ UNKNOWN – double-check setup!" %}
  {% set build_surface = "⚠️ UNKNOWN" %}
  {% set adhesive = "n/a" %}

  # Recommendations
  {% if filament in pla_set %}
    {% set chamber_policy = "Open / Vented <35C" %}
    {% set build_surface = "SMOOTH PEI" %}
    {% set adhesive = "None (or light glue stick as a release layer)" %}

  {% elif filament in petg_set %}
    {% set chamber_policy = "Open / Vented <35C" %}
    {% set build_surface = "TEXTURED PEI - protects PEI" %}
    {% set adhesive = "None; if using SMOOTH PEI, use glue stick/Magigoo as a release layer" %}

  {% elif filament in tpu_set %}
    {% set chamber_policy = "Open / Vented <35C" %}
    {% set build_surface = "TEXTURED PEI - AVOID SMOOTH PEI!" %}
    {% set adhesive = "None; if too grabby, use light glue stick as a release layer" %}

  {% elif filament in asa_abs_set %}
    {% set chamber_policy = "Sealed <45C (watch heat creep)" %}
    {% set build_surface = "GAROLITE + Magigoo OR TEXTURED PEI for convenience" %}
    {% set adhesive = "Magigoo (ABS/Original) recommended; brim if needed" %}

  {% elif filament in pctg_set %}
    {% set chamber_policy = "Sealed <45C OR Vented if heat creep shows up" %}
    {% set build_surface = "TEXTURED PEI preferred; GAROLITE for extra insurance" %}
    {% set adhesive = "Usually none; Magigoo if corners lift" %}

  {% elif filament in eng_set %}
    {% set chamber_policy = "Sealed <45C (watch heat creep)" %}
    {% set build_surface = "GAROLITE strongly recommended" %}
    {% set adhesive = "Magigoo Original; Supergrip if fighting lift on PA/PC" %}

  {% else %}
    {action_respond_warn("⚠️ Filament type UNKNOWN – double-check plate, chamber, and temps!")}
  {% endif %}

  {action_respond_info("----- START_PRINT CHECK -----")}
  {action_respond_info("Nozzle: " ~ nozzle ~ " mm")}
  {action_respond_info("Temps: Bed " ~ bed ~ "C, Nozzle " ~ hotend ~ "C")}
  {action_respond_info("Filament: " ~ filament_raw ~ "  ->  " ~ filament)}
  {action_respond_info("Build surface: " ~ build_surface)}
  {action_respond_info("Adhesive: " ~ adhesive)}
  {action_respond_info("Chamber: " ~ chamber_policy)}
  {action_respond_info("-----------------------------")}