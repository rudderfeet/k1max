filament_notes = "1. Flow rate of 1.00 set on 1/21/2025 with Inland PLA+ on a 50C bed with 200C nozzle, after following https://teachingtechyt.github.io/calibration.html#flow across three samples.\n2. Left XY material shrinkage to 0.0% on 1/19/2025 based on https://vector3d.shop/pages/califlower-calibration-calculator-mk2.\n3. Set this profile on 1/19/2025 to apply only to my K1 Max printer, since the S1s have their own settings.\n\nPLA is incredibly easy to print fast, has wonderful surface finish and is actually very strong, albeit without good UV or heat resistance. It's a go-to for indoor toys, jigs, fixtures, prototypes and \"throw-away\" items, but if it needs to travel or survive in the sun, go with PCTG, ASA or an exotic material.\n\nA good materials mental model\n-------------------------------\n* PCTG → Mechanical workhorse + forgiving + stable (default functional choice)\n* PETG → Similar to PCTG with a little more stringing, but has many color options\n* ASA/ABS → Outdoor shape stability, moderate loads, UV/heat exposure\n* PC → Hot + strike impact + “don’t crack” (worth the printing hassles)\n* PA / PA-CF → Mechanical cycling, fatigue, clamps, flex (print quality matters)\n* PLA → Prototypes, fixtures, jigs, toys, and “throw-away”\n* TPU  → Flexable models, vibration dampening, soft interfaces to avoid scratches"
